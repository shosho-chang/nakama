# 租屋物件追蹤條件（agents/franky/jobs/rental_watch.py 讀這份）
#
# 修修 2026-10-23：錄音室年底租約到期，找新辦公室。條件改這裡就好，不用動程式。
# 行政區名稱要寫全名（含「區」），程式內有各站的代碼對照表。

districts: [中正區, 中山區, 大安區, 信義區, 文山區]

price:        # 月租（元）
  min: 15000
  max: 35000

area:         # 坪
  min: 10
  max: 50

# 店面類只推地下室：一樓店面臨街、吵又貴，不適合錄音；但很多地下室空間是登在店面類。
store_basement_only: true

# 頂樓加蓋不推（隔音、漏水、合法性都差）。
exclude_rooftop: true

# 標題含這些字的不推——多半是商務中心的座位（標 30 坪，實際租到的是共用樓層的一間小房）。
exclude_title_keywords:
  - 人辦公室
  - 人捷運辦公
  - 人景觀辦公
  - 免費會議室
  - 掛址
  - 設址
  - 商務中心
  - 共享
  - 座位
  - 席位
  - 一價全包

# 同上，用 regex 抓「4-6人」「2~4人」這種以座位數賣的格局。
exclude_title_patterns:
  - '\d+\s*[~～\-－至]\s*\d+\s*人'
