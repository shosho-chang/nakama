# 租屋物件追蹤條件（agents/franky/jobs/rental_watch.py 讀這份）
#
# 修修 2026-10-23：錄音室年底租約到期，找新辦公室。條件改這裡就好，不用動程式。
# 行政區名稱要寫全名（含「區」），程式內有各站的代碼對照表。

districts: [中正區, 中山區, 大安區, 信義區, 文山區]

price:        # 月租（元，未稅的已加回稅費）；修修 2026-10-25 上限從 40,000 調到 45,000
  min: 20000
  max: 45000

# 每坪租金比同區中位數貴超過幾 % 就不列（修修 2026-10-25）。中位數用目前在架、符合上面
# 條件的這一批算，未稅的用加回稅費後的金額；同區不到 3 筆或沒坪數的算不出來，照列。
max_over_median_pct: 10

area:         # 坪
  min: 10
  max: 50

# 必要條件（修修 2026-10-23）：捷運一定要近、要能做營業登記。
# 只有 591 有這兩項資料（列表附最近捷運站距離＋「可登記」標籤；沒標的另抓詳細頁的「登記」欄）。
# 信義、好房網沒有 → 不刪，放「待確認」；確定不符合（距離超過門檻、標示不可登記）才收起來、不推播。
mrt_max_m: 600        # 距最近捷運站幾公尺內算「近」（步行約 7–8 分鐘；修修 2026-10-23 從 500 放寬）

# 地下室全部剔除（修修 2026-10-23：濕度傷攝影器材、防空避難室不能當工作室、離捷運振源最近）。
exclude_basement: true

# 這幾區排序加分（修修 2026-10-23）。
bonus_districts: [大安區, 文山區]

# 店面類只推地下室：一樓店面臨街、吵又貴，不適合錄音；但很多地下室空間是登在店面類。
# 跟 exclude_basement 同時開 → 店面類一筆都不會留，程式就不去抓店面類（少打幾次網站）。
store_basement_only: true

# 頂樓加蓋不推（隔音、漏水、合法性都差）。
exclude_rooftop: true

# 標題含這些字的不推——多半是商務中心的座位（標 30 坪，實際租到的是共用樓層的一間小房）。
exclude_title_keywords:
  - 人辦公室
  - 人捷運辦公
  - 人景觀辦公
  - 免費會議室
  - 掛址
  - 設址
  - 商務中心
  - 共享
  - 座位
  - 席位
  - 一價全包
  # 連鎖商務中心品牌（標 50 坪、月租 2–3 萬，其實是租一間 2 人座的小房，會把每坪單價算得超便宜）
  - Regus
  - Spaces
  - WeWork
  - IWG
  - 雷格斯
  - 私人辦公空間
  - 專業辦公空間

# 同上，用 regex 抓以座位數賣的格局：「4-6人」「2~4人」「適合2人」「3人辦公」。
exclude_title_patterns:
  - '\d+\s*[~～\-－至]\s*\d+\s*人'
  - '(適合|使用|容納)\s*\d+\s*人'
  - '\d+\s*人(的)?(私人|專業|獨立)?辦公'
