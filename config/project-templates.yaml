# 專案樣板 — 建立專案時一次把該類型的任務全部開好（ADR-068 §範本）。
#
# 修修可以直接改這份，不需要重新部署程式：服務會在下次讀取時載入新內容。
# 每個 stage 會變成一個任務，檔名走既有雙寫慣例「{專案} - {stage}」，
# 並在 frontmatter 記 `stage:`，專案 dashboard 的進度軌就是靠它分組。
#
# 進度軌的狀態**完全由任務的完成度推導**，沒有任何可以手動勾的階段——
# 這是 ADR-031 七道工序失敗的根因，不重蹈。
#
# 欄位：
#   label      顯示名稱（建立表單的下拉選項 + 專案頁的類型 chip）
#   stages[]   依序排列的階段；name = 任務名，pomodoros = 預設預估🍅，
#              notes（可省略）= 建立任務時預先寫進任務內文的段落
#
# 刪掉某個 kind 不會弄壞既有專案：找不到樣板的專案只是不顯示進度軌，
# 任務照常列在「其他任務」。

templates:
  podcast:
    label: Podcast · 訪談集
    stages:
      - { name: 訪綱撰寫, pomodoros: 3 }
      - { name: 節目錄製, pomodoros: 4 }
      - name: 後製與上架
        pomodoros: 8
        notes: |
          ## Intro

          大家好！歡迎收聽今天的不正常人類研究所，我是修修！每集節目我都會邀請到一位不太正常的來賓，有的是行為舉止怪異，有的是從事的工作很奇特，但更多的是，他們人生的選擇很不尋常。我希望從他們身上學到些東西，看看在這社會的主流價值觀以外，還會有什麼其他的可能性。

          ## Outro

          我們今天的節目就到這邊，我同時也會把完整訪談的影片放在節目的 YouTube 頻道上，有興趣的朋友可以連過去看。最後，如果你喜歡我們的節目，也請你到 Apple Podcast 或 Spotify 幫我訂閱、留言，或分享給您的朋友。這些都可以幫助我們繼續挖掘更多不正常人類的故事。這裡是不正常人類研究所，祝你能成為最好版本的自己，活出屬於你的不正常人生。我們下次見，掰掰！

  youtube-book:
    label: YouTube · 書籍介紹
    stages:
      - { name: 前期研究, pomodoros: 6 }
      - { name: 拍攝, pomodoros: 3 }
      - { name: 後製, pomodoros: 8 }
      - { name: 上架, pomodoros: 2 }

  youtube-health:
    label: YouTube · 身心健康研究
    stages:
      - { name: 前期研究, pomodoros: 8 }
      - { name: 拍攝, pomodoros: 3 }
      - { name: 後製, pomodoros: 8 }
      - { name: 上架, pomodoros: 2 }
