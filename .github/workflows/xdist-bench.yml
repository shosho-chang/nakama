name: xdist-bench (temporary, remove before merge)

on:
  pull_request:
    branches: [main]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: lscpu | grep -E "Model name|Thread|Core"
      - run: python -m compileall -q agents shared tests thousand_sunny scripts gateway
      - name: not-slow (typical PR)
        run: pytest -q -n auto -m "not slow" --cov=shared --cov=thousand_sunny --cov=agents --cov-report=json:coverage.json --cov-report= | tail -1 && python scripts/check_critical_path_coverage.py | tail -1
      - name: full (main push / PR touching slow area)
        run: pytest -q -n auto --cov=shared --cov=thousand_sunny --cov=agents --cov-report= | tail -1
