name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'memory/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'memory/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ffmpeg (required by shared/audio_clip + transcriber + video line ffprobe/emit)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # video/ Node steps removed by ADR-050 D3 — the TS DSL parser retired;
      # remaining video/compositions/ are Hyperframes HTML rendered locally
      # (npx hyperframes), never in CI. Render-dependent tests self-skip.

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests with coverage
        run: pytest --cov=shared --cov=thousand_sunny --cov=agents --cov-report=json:coverage.json --cov-report=term

      - name: Critical-path coverage gate
        run: python scripts/check_critical_path_coverage.py
