name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'memory/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'memory/**'
      - '.github/ISSUE_TEMPLATE/**'

# PR：同一條 branch 推新 commit／rebase 時取消舊的那輪（舊結果已無用，只會佔 runner）。
# main push：group 帶 sha，每個 commit 各自一組、不互相取消（main 每一輪都要跑完）。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ffmpeg (required by transcriber + video line ffprobe/emit)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # video/ Node steps removed by ADR-050 D3 — the TS DSL parser retired;
      # remaining video/compositions/ are Hyperframes HTML rendered locally
      # (npx hyperframes), never in CI. Render-dependent tests self-skip.

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests with coverage
        # -n auto：xdist 依實體核心數開 worker（GH public runner = 4 vCPU / 2 實體核 → 2 worker）。
        # 實測（PR #1386）：2 worker 測試 8:22；-n logical 開 4 worker 反而 10:09
        # （超執行緒互搶，每個測試約慢一倍），所以不要改成 logical。
        # pytest-cov 會自動合併各 worker 的覆蓋率，critical-path gate 照讀 coverage.json。
        # --durations=25：log 尾端列最慢的 25 個測試，下次 CI 又變慢時直接看這裡。
        run: pytest -n auto --durations=25 --cov=shared --cov=thousand_sunny --cov=agents --cov-report=json:coverage.json --cov-report=term

      - name: Critical-path coverage gate
        run: python scripts/check_critical_path_coverage.py
