<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 20">
  <!-- Nakama brand bolt: orange zigzag lightning climbing from lower-left to
       upper-right (PANTONE 165 PC, hex ff7a18, matches the sho-accent token).
       Three teeth, each peak/valley pair shifted up by 2 units; overall
       slope rises while preserving zigzag rhythm. Stroke-only. -->
  <polyline points="2,16 6,10 9,14 13,8 16,12 20,6 24,10"
            fill="none" stroke="#ff7a18"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
