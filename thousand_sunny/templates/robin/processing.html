<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robin · 處理中</title>
<script src="/static/shosho/theme.js?v={{ asset_version }}"></script>
<link rel="stylesheet" href="/static/shosho/tokens.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/shosho/robin.css?v={{ asset_version }}">
</head>
<body class="sho robin-center">
<div class="card">
  <div class="spinner"></div>
  <h2>{{ label }}</h2>
  <p id="status">連線中...</p>
  <div id="error" class="error-msg" style="display:none"></div>
  <a href="/" class="back-link" style="display:none" id="back">← 返回</a>
  <form method="post" action="/cancel" id="cancel-form" style="margin:0">
    <button type="submit" class="cancel-btn">取消</button>
  </form>
</div>
<script>
const sessionId = "{{ session_id }}";
const evtSource = new EventSource("/robin/events/" + sessionId);

evtSource.addEventListener("status", function(e) {
  const data = JSON.parse(e.data);
  document.getElementById("status").textContent = data.msg;
});

evtSource.addEventListener("done", function(e) {
  evtSource.close();
  document.getElementById("cancel-form").style.display = "none";
  const data = JSON.parse(e.data);
  window.location.href = data.redirect;
});

evtSource.addEventListener("error", function(e) {
  evtSource.close();
  let msg = "發生錯誤，請重試";
  try { msg = JSON.parse(e.data).msg; } catch(err) {}
  document.getElementById("error").textContent = msg;
  document.getElementById("error").style.display = "block";
  document.getElementById("back").style.display = "inline-block";
  document.getElementById("cancel-form").style.display = "none";
  document.querySelector(".spinner").style.display = "none";
});

evtSource.onerror = function() {
  document.getElementById("status").textContent = "連線中斷，等待重連...";
};
</script>
</body>
</html>
