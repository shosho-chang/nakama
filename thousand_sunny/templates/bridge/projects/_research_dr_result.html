{# Deep Research report fragment — returned by POST /research/dr-report. #}
<div class="pj-research-result pj-research-result--dr" data-research-kind="dr">
  <header class="pj-research-result-head">
    <h3 class="pj-section-subtitle">🌐 Deep Research 報告</h3>
    <span class="pj-research-meta">{{ timestamp }} · 來源 <code>{{ source }}</code></span>
  </header>

  <div class="pj-dr-body markdown-body">
    {{ report_html | safe }}
  </div>
</div>
