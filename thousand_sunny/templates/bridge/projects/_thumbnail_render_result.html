{# ADR-033 PR4-A — single rendered thumbnail (HTMX swap target for one idea card). #}
<figure class="pj-thumb-render-result">
  <img
    src="/bridge/projects/{{ slug }}/thumbnail/candidate/{{ run_ts }}/{{ filename }}"
    alt="thumbnail candidate for idea {{ idea_index + 1 }}"
    class="pj-thumb-render-img"
    width="1280"
    height="720">
  <figcaption class="pj-thumb-render-meta">
    <span class="pj-thumb-render-ts">渲於 {{ run_ts }}</span>
    <span class="pj-thumb-render-emotion">表情：<code>{{ parsed.emotion_key }}</code></span>
  </figcaption>
  <form
    class="pj-thumb-commit-form"
    method="post"
    action="/bridge/projects/{{ slug }}/thumbnail/commit"
    hx-post="/bridge/projects/{{ slug }}/thumbnail/commit"
    hx-target="#thumb-commit-{{ idea_index }}"
    hx-swap="innerHTML"
    hx-confirm="commit 為最終 thumbnail？舊的會 archive。">
    <input type="hidden" name="run_ts" value="{{ run_ts }}">
    <input type="hidden" name="filename" value="{{ filename }}">
    <button type="submit" class="pj-btn-primary pj-btn--save">✓ commit 為最終 thumbnail</button>
  </form>
  <div id="thumb-commit-{{ idea_index }}" class="pj-thumb-commit-slot"></div>
</figure>
