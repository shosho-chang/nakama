<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nakama · 登入</title>
<link rel="stylesheet" href="/static/shosho/tokens.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/shosho/login.css?v={{ asset_version }}">
</head>
<body class="sho">
<div class="card">
  <div class="logo">🏴‍☠️</div>
  <h1>Nakama</h1>
  <p class="subtitle">Crew Access</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">密碼</label>
    <input type="password" id="password" name="password" autofocus placeholder="輸入密碼">
    <button type="submit">進入</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</div>
</body>
</html>
