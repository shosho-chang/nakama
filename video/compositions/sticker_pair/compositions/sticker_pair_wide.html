<!-- nakama:component sticker_pair_wide（長片 16:9 雙貼紙 / 證物大圖，透明 overlay 疊 Resolve track 4）
     與直式 sticker_pair.html 同一套動畫語彙（彈入 + 浮動待機 + 快收），只重調幾何：

     1. 1920×1080。左右貼紙推到 6% 邊緣——16:9 的講者在中央，兩側是空的牆面，
        正好是貼紙的位置；直式版沒有這個餘裕。
     2. 貼紙預設寬 18%（直式 26%）：26% 的 1920 = 500px，在只有 1080 高的畫面裡
        佔到 46% 高、會壓過講者。18% = 346px ≈ 32% 高，才是配角的份量。
     3. **center（論文封面/書封證物）改用 height 定尺寸**：直式版寫 width:52%，
        搬到 16:9 會變 1000px 寬 × ~1300px 高——直接超出 1080 畫布。
        改 height:72% + width:auto，任何長寬比的證物都保證裝得下。 -->
<!doctype html>
<html
  lang="zh-Hant"
  data-composition-variables='[
    {"id":"left_src","type":"string","label":"左貼紙（data URI）","default":""},
    {"id":"right_src","type":"string","label":"右貼紙（data URI）","default":""},
    {"id":"center_src","type":"string","label":"置中大圖（data URI，論文封面/書封用）","default":""},
    {"id":"show_sec","type":"number","label":"顯示秒數","default":5.0},
    {"id":"y_pct","type":"number","label":"貼紙垂直中心 %","default":46},
    {"id":"size_pct","type":"number","label":"貼紙寬 %（畫面寬）","default":18}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .sticker {
        position: absolute; top: var(--y, 46%);
        width: var(--w, 18%);
        /* ⚠️ 這裡**不可**寫 transform：GSAP 用 xPercent/yPercent 定位，
           CSS transform 會被 GSAP 解析成 px 後再疊加一次 → 位移加倍
           （二十四輪血案：論文卡被推出畫面左緣一半、標題讀不到）。
           垂直居中一律交給 GSAP 的 yPercent: -50。 */
        opacity: 0;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
      }
      #left  { left: 6%; }
      #right { right: 6%; }
      /* center = 論文封面/書封證物模式：置中大圖 + 白框（evidence_doc 語彙）。
         16:9 的瓶頸是高度不是寬度 → 用 height 定尺寸、width 自動跟著長寬比。 */
      #center {
        left: 50%;  /* 水平居中由 GSAP xPercent: -50 完成，勿加 transform */
        height: 72%;
        width: auto;
        border: 8px solid #fff;
        border-radius: 6px;
        filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.5));
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-root="true"
      data-composition-id="sticker_pair_wide"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="8"
    >
      <img class="sticker" id="left" alt="" />
      <img class="sticker" id="right" alt="" />
      <img class="sticker" id="center" alt="" />
    </div>
    <script>
      const vars =
        (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const showSec = Number(vars.show_sec ?? 5.0);
      const yPct = Number(vars.y_pct ?? 46);
      const sizePct = Number(vars.size_pct ?? 18);
      for (const [id, src, w] of [
        ["left", vars.left_src, sizePct],
        ["right", vars.right_src, sizePct],
        ["center", vars.center_src, null],
      ]) {
        const el = document.getElementById(id);
        if (src) {
          el.src = src;
          el.style.setProperty("--y", `${yPct}%`);
          el.style.top = `${yPct}%`;
          // center 由 CSS 的 height:72% 定尺寸，不覆寫 width（覆寫會破壞長寬比保護）
          if (w !== null) el.style.width = `${w}%`;
        } else {
          el.remove();
        }
      }
      const hasCenter = !!vars.center_src;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ defaults: { transformOrigin: "50% 60%" } });
      // 進場：波旬範本語法——貼紙彈入（scale pop + 微旋轉），左右錯拍
      tl.fromTo(
        "#left, #right",
        { opacity: 0, scale: 0.2, rotation: -8, yPercent: -42 },
        {
          opacity: 1,
          scale: 1,
          rotation: 0,
          yPercent: -50,
          duration: 0.45,
          ease: "back.out(1.7)",
          stagger: 0.18,
        },
        0
      );
      // 待機（十五輪：修修要看得出在動）：浮動 + 旋轉搖擺 + 呼吸縮放
      for (const [sel, amp, rot, dur, at] of [
        ["#left", 12, 6, 0.85, 0.5],
        ["#right", 12, -6, 1.0, 0.62],
      ]) {
        // one-sided yoyo：從進場終點出發，無縫接待機
        tl.to(sel, {
          yPercent: -50 + amp, duration: dur, ease: "sine.inOut", yoyo: true, repeat: -1,
        }, at);
        tl.to(sel, {
          rotation: rot, duration: dur * 1.4, ease: "sine.inOut", yoyo: true, repeat: -1,
        }, at);
        tl.to(sel, {
          scale: 1.12, duration: dur * 1.15, ease: "sine.inOut", yoyo: true, repeat: -1,
        }, at + 0.2);
      }
      // center（論文封面/書封）：正面彈入 + 緩慢漂浮，證物感不搞笑
      if (hasCenter) {
        tl.fromTo(
          "#center",
          { opacity: 0, scale: 0.55, rotation: 4, xPercent: -50, yPercent: -40 },
          {
            opacity: 1,
            scale: 1,
            rotation: -1.2,
            xPercent: -50,
            yPercent: -50,
            duration: 0.5,
            ease: "back.out(1.6)",
          },
          0
        );
        tl.to("#center", {
          yPercent: -47, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: -1,
        }, 0.6);
        tl.to("#center", {
          rotation: 1.2, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: -1,
        }, 0.6);
      }
      // 退場：縮小淡出（獨立 timeline——主 tl 有 infinite repeat 撐著待機動畫）
      gsap.to(".sticker", {
        opacity: 0,
        scale: 0.6,
        duration: 0.25,
        ease: "power2.in",
        delay: Math.max(0.3, showSec - 0.25),
      });
      window.__timelines.main = tl;
    </script>
  </body>
</html>
