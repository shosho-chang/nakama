<!-- nakama:component sticker_pair（波旬式雙貼紙：講故事時兩張插畫貼在講者兩側，
     透明 overlay 疊 Resolve track 4。圖片走 data URI variables——素材是
     episode 資料，不進 repo composition assets） -->
<!doctype html>
<html
  lang="zh-Hant"
  data-composition-variables='[
    {"id":"left_src","type":"string","label":"左貼紙（data URI）","default":""},
    {"id":"right_src","type":"string","label":"右貼紙（data URI）","default":""},
    {"id":"show_sec","type":"number","label":"顯示秒數","default":5.0},
    {"id":"y_pct","type":"number","label":"貼紙垂直中心 %","default":46},
    {"id":"size_pct","type":"number","label":"貼紙寬 %（畫面寬）","default":26}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .sticker {
        position: absolute; top: var(--y, 46%);
        width: var(--w, 26%);
        transform: translateY(-50%);
        opacity: 0;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
      }
      #left  { left: 5%; }
      #right { right: 5%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-root="true"
      data-composition-id="sticker_pair"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="8"
    >
      <img class="sticker" id="left" alt="" />
      <img class="sticker" id="right" alt="" />
    </div>
    <script>
      const vars =
        (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const showSec = Number(vars.show_sec ?? 5.0);
      const yPct = Number(vars.y_pct ?? 46);
      const sizePct = Number(vars.size_pct ?? 26);
      for (const [id, src] of [["left", vars.left_src], ["right", vars.right_src]]) {
        const el = document.getElementById(id);
        if (src) {
          el.src = src;
          el.style.setProperty("--y", `${yPct}%`);
          el.style.top = `${yPct}%`;
          el.style.width = `${sizePct}%`;
        } else {
          el.remove();
        }
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ defaults: { transformOrigin: "50% 60%" } });
      // 進場：波旬範本語法——貼紙彈入（scale pop + 微旋轉），左右錯拍
      tl.fromTo(
        ".sticker",
        { opacity: 0, scale: 0.2, rotation: -8, yPercent: -42 },
        {
          opacity: 1,
          scale: 1,
          rotation: 0,
          yPercent: -50,
          duration: 0.45,
          ease: "back.out(1.7)",
          stagger: 0.18,
        },
        0
      );
      // 待機：輕微上下浮動（貼紙「活著」但不搶戲）
      tl.to(
        "#left",
        { yPercent: -46, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: -1 },
        0.5
      );
      tl.to(
        "#right",
        { yPercent: -54, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: -1 },
        0.65
      );
      // 退場：縮小淡出（獨立 timeline——主 tl 有 infinite repeat 撐著待機動畫）
      gsap.to(".sticker", {
        opacity: 0,
        scale: 0.6,
        duration: 0.25,
        ease: "power2.in",
        delay: Math.max(0.3, showSec - 0.25),
      });
      window.__timelines.main = tl;
    </script>
  </body>
</html>
