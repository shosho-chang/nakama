<!doctype html>
<!-- 第 5 類「解釋動畫」圖表「對比」：兩組東西對照（每組一個標題＋一句說明＋幾個項目）。
     欄標題、項目在講到的那句出現；正在講的那一項底色橘、講過的回白。
     最後的重點（mark）把某一項再點亮一次，右上角貼一張斜的黑牌（一個畫面只一張）。
     滿版左右兩欄、中間一條黑直線；側欄上下兩組、中間一條黑橫線。
     不綁任何一集：內容全部從 spec 來（欄位見 youtube-explainer skill「圖表：對比」）。 -->
<html lang="zh-Hant"
  data-composition-variables='[
    {"id":"spec","type":"string","label":"內容 JSON（見 youtube-explainer skill「圖表：對比」）","default":"{\"layout\":\"full\",\"title\":\"範例標題\",\"show_sec\":8,\"columns\":[{\"label\":\"左邊\",\"at\":0.8,\"items\":[{\"text\":\"項目一\",\"at\":1.5},{\"text\":\"項目二\",\"at\":2.2}]},{\"label\":\"右邊\",\"at\":3,\"sub\":\"範例說明\",\"items\":[{\"text\":\"項目三\",\"at\":3.8},{\"text\":\"項目四\",\"at\":4.5}]}],\"rest_at\":5.5,\"mark\":{\"column\":1,\"item\":1,\"at\":6,\"text\":\"範例重點\"}}"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <script src="assets/kit/explainer-kit.js"></script>
    <link rel="stylesheet" href="assets/kit/explainer-kit.css" />
    <style>
      /* 整組在內容區上下置中（項目少時不會全擠在上半部）；中線只跟內容一樣長 */
      .cols { position: absolute; left: 0; right: 0; top: 120px; bottom: 0; display: grid;
        grid-template-columns: 1fr 6px 1fr; column-gap: 90px; align-content: center; }
      .side .cols, .cols.side { grid-template-columns: 1fr; grid-template-rows: auto 6px auto; row-gap: 26px; }
      .divider { background: var(--ink); }
      .col { display: flex; flex-direction: column; min-width: 0; }
      .clabel, .csub { white-space: nowrap; }
      .csub { color: var(--ink-2); }
      .items { display: flex; flex-direction: column; }
      .item { position: relative; background: var(--white); display: flex; align-items: center; white-space: nowrap; }
      /* 重點牌：黑底白字，斜貼在那一項的右端、上下置中（不壓到上一項） */
      .mark { position: absolute; right: 16px; top: 50%; background: var(--ink); color: var(--white); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-root="true" data-composition-id="contrast"
      data-width="1920" data-height="1080" data-start="0" data-duration="60"></div>
    <script>
      const spec = JSON.parse(EXK.vars().spec || "{}");
      const ctx = EXK.frame("contrast", spec);
      const { tl, stage, full } = ctx;
      const cols = EXK.el("div", "cols" + (full ? "" : " side"), stage);
      const C = (spec.columns || []).slice(0, 2);
      if (C.some((c) => (c.items || []).length > 5)) console.warn("對比一欄超過 5 項：放不下就是 Director 要拆");

      // 字級：滿版／側欄；項目多或字長時整組等比縮
      const BASE = full ? { label: 72, sub: 40, subGap: 18, subAfter: 30, item: 56, itemH: 96, itemGap: 18, pad: 36, mark: 40 }
                        : { label: 48, sub: 30, subGap: 10, subAfter: 16, item: 38, itemH: 64, itemGap: 10, pad: 24, mark: 30 };
      const hasSub = C.some((c) => c.sub);
      const cells = [], labs = [], subs = [], boxes = [];
      const steps = [];
      C.forEach((c, ci) => {
        if (ci === 1) {
          const d = EXK.el("div", "divider", cols);
          tl.fromTo(d, full ? { scaleY: 0, transformOrigin: "50% 0%" } : { scaleX: 0, transformOrigin: "0% 50%" },
            full ? { scaleY: 1, duration: 0.3, ease: EXK.SNAP } : { scaleX: 1, duration: 0.3, ease: EXK.SNAP }, c.at - 0.15);
        }
        const col = EXK.el("div", "col", cols);
        const lab = EXK.el("div", "clabel", col, c.label);
        labs.push(lab);
        EXK.land(tl, lab, c.at, full ? { x: ci ? 30 : -30, y: 0 } : { x: 0, y: 20 });
        // 兩欄都留說明那一行的高度（左右的項目才會對齊）；側欄沒有說明就不留
        const sub = (c.sub || (full && hasSub)) ? EXK.el("div", "csub", col, c.sub || "") : null;
        if (sub) subs.push(sub);
        if (c.sub) tl.fromTo(sub, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.22, ease: EXK.SNAP }, c.sub_at ?? c.at);
        const items = EXK.el("div", "items", col);
        boxes.push(items);
        cells[ci] = [];
        steps.push([c.at, null]);   // 換組時上一組講過的回白
        (c.items || []).forEach((it) => {
          const box = EXK.el("div", "item", items, it.text);
          EXK.land(tl, box, it.at, full ? { x: ci ? 40 : -40, y: 0 } : { x: 30, y: 0 });
          steps.push([it.at, box]);
          cells[ci].push(box);
        });
      });

      let tag = null;
      const m = spec.mark;
      const mcell = m && cells[m.column] && cells[m.column][m.item];
      if (mcell && m.text) tag = EXK.el("div", "mark", mcell, m.text);

      const apply = (k) => {
        const px = (v) => Math.round(v * k) + "px";
        labs.forEach((e) => (e.style.fontSize = px(BASE.label)));
        subs.forEach((e) => { e.style.fontSize = px(BASE.sub); e.style.height = px(BASE.sub); e.style.margin = `${px(BASE.subGap)} 0 0`; });
        boxes.forEach((e) => { e.style.gap = px(BASE.itemGap); e.style.marginTop = px(BASE.subAfter); });
        cells.flat().forEach((e) => { e.style.fontSize = px(BASE.item); e.style.height = px(BASE.itemH); e.style.paddingLeft = px(BASE.pad); e.style.paddingRight = px(BASE.pad); });
        if (tag) { tag.style.fontSize = px(BASE.mark); tag.style.padding = `${px(12)} ${px(22)} ${px(14)}`; }
      };
      apply(1);
      // 寬：每一欄裡最寬的字（項目含左右留白；被點名的那一項再加上黑牌）不超過欄寬；高：整組不超過內容區
      const colW = full ? (1620 - 90 * 2 - 6) / 2 : 640;
      const textW = (e) => { const r = document.createRange(); r.selectNodeContents(e.firstChild); return r.getBoundingClientRect().width; };
      const widest = Math.max(1, ...[...labs, ...subs].filter((e) => e.firstChild).map(textW),
        ...cells.flat().map((e) => textW(e) + 2 * BASE.pad + (e === mcell && tag ? tag.offsetWidth * 1.05 + 16 : 0)));
      // 量高度時先靠上排：置中排的內容超出時，上面超出的那半 scrollHeight 量不到
      cols.style.alignContent = "start";
      const k = Math.min(1, colW / widest, cols.clientHeight / Math.max(1, cols.scrollHeight));
      cols.style.alignContent = "";
      if (k < 1) apply(k);

      // 講到哪一項，那一項的底染橘；講過的回白（字一直是黑的）
      if (spec.rest_at != null) steps.push([spec.rest_at, null]);
      if (mcell) steps.push([m.at, mcell]);
      steps.sort((a, b) => a[0] - b[0]);
      let prev = null;
      steps.forEach(([t, e]) => {
        if (prev && prev !== e) tl.to(prev, { backgroundColor: "#fff", duration: 0.14 }, t);
        if (e && e !== prev) tl.to(e, { backgroundColor: EXK.ORANGE, duration: 0.14 }, t);
        prev = e;
      });
      if (tag) {
        gsap.set(tag, { yPercent: -50, rotation: -4 });
        tl.fromTo(tag, { opacity: 0, scale: 1.25, rotation: -9, yPercent: -50 }, { opacity: 1, scale: 1, rotation: -4, yPercent: -50, duration: 0.3, ease: EXK.LAND }, m.at);
      }
      EXK.end(ctx);
    </script>
  </body>
</html>
