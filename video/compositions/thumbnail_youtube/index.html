<!doctype html>
<!--
  ADR-033 — YouTube thumbnail composition.

  2026-05-27 v3 (Path A+B locked-template AI-gen pivot):
    - 5 playbook archetypes hard-coded as CSS overlay variants (tv1 / tv2 /
      tv3 / tv8 / tv10) on top of a GPT Image 1 generated bg image.
    - The AI image already includes the subject (cutout fed as reference) so
      the #cutout layer is hidden for tv* archetypes. Composition only adds
      the Chinese title + (for T-V10) the giant number.
    - Default + face-number / question / framework variants kept as fallback
      when AI gen fails (soft-fail path uses archetype="default").

  Resolution: 1280x720 (YouTube spec). AI bg comes in at 1536x1024 and is
  object-fit:cover'd into the frame.

  Variables (window.__hyperframes.getVariables()):
    title_hook        — Chinese title overlay text (1-12 chars)
    cutout_data_url   — host cutout PNG (used only for non-tv archetypes)
    bg_data_url       — AI-gen scene PNG OR optional fallback bg
    accent_decoration — small text/number; for T-V10 it becomes GIANT
    archetype         — "default" | "face-number" | "question" | "framework"
                        | "tv1-face-right" | "tv2-face-center"
                        | "tv3-split" | "tv8-color-pop" | "tv10-number-hero"
    palette           — { bg, bg_2, fg, accent, accent_2, stroke, bg_darken }
-->
<html lang="zh-Hant" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Bangers&family=Anton&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "LineSeedTW";
        src: url("../bigstat/assets/fonts/line-seed-tw/LINESeedTW_OTF_Eb.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #000;
        font-family: "LineSeedTW", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      :root {
        --bg:        #1B3A2E;
        --bg-2:      #0E2018;
        --fg:        #FFF8E7;
        --accent:    #FFC857;
        --accent-2:  #E07A5F;
        --stroke:    #0A0F0C;
        --bg-darken: 0.30;
      }

      #root {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 30% 40%,
          var(--bg) 0%, var(--bg-2) 70%, #050808 100%
        );
      }

      /* AI bg image — full-bleed, object-fit cover to crop the 1536x1024 into 16:9 */
      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      /* Overlay — darker for non-AI fallback paths; lightest for AI paths */
      #overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          110deg,
          rgba(0, 0, 0, calc(var(--bg-darken) + 0.20)) 0%,
          rgba(0, 0, 0, var(--bg-darken)) 45%,
          rgba(0, 0, 0, calc(var(--bg-darken) - 0.10)) 100%
        );
        z-index: 2;
      }

      /* Cutout layer — hidden for tv* archetypes (AI already composed subject) */
      #cutout {
        position: absolute;
        right: -40px;
        bottom: 0;
        height: 105%;
        width: auto;
        max-width: 720px;
        z-index: 5;
        object-fit: contain;
        object-position: bottom right;
        filter: drop-shadow(-18px 12px 32px rgba(0, 0, 0, 0.55));
      }

      /* Title — default position, overridden per archetype below */
      #title-hook {
        position: absolute;
        z-index: 6;
        color: var(--fg);
        font-family: "LineSeedTW", "Noto Sans TC", "Anton", sans-serif;
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: 0;
        -webkit-text-stroke: 10px var(--stroke);
        paint-order: stroke fill;
        text-shadow:
          8px 8px 0 var(--stroke),
          0 0 32px rgba(0, 0, 0, 0.45);
      }

      /* Accent decoration — default, overridden per archetype */
      #accent {
        position: absolute;
        z-index: 7;
        color: var(--accent);
        font-family: "Bangers", "Anton", "Noto Sans TC", sans-serif;
        font-weight: 900;
        letter-spacing: 0.04em;
        -webkit-text-stroke: 6px var(--stroke);
        paint-order: stroke fill;
        text-shadow: 6px 6px 0 var(--stroke);
        line-height: 1;
      }
      #accent:empty { display: none; }

      /* ════════════════════════════════════════════════════════════════════
         DEFAULT FALLBACK VARIANT (used when AI gen fails / not configured)
         Title left + cutout right.
      ════════════════════════════════════════════════════════════════════ */

      #root[data-archetype="default"] #title-hook,
      #root[data-archetype="face-number"] #title-hook,
      #root[data-archetype="question"] #title-hook,
      #root[data-archetype="framework"] #title-hook {
        left: 56px;
        top: 50%;
        transform: translateY(-52%);
        max-width: 680px;
        font-size: 180px;
      }
      #root[data-archetype="default"] #title-hook::before,
      #root[data-archetype="face-number"] #title-hook::before,
      #root[data-archetype="question"] #title-hook::before,
      #root[data-archetype="framework"] #title-hook::before {
        content: "";
        position: absolute;
        left: 4px;
        bottom: -22px;
        width: 96px;
        height: 12px;
        background: var(--accent);
        border-radius: 2px;
        box-shadow: 4px 4px 0 var(--stroke);
      }
      #root[data-archetype="default"] #accent,
      #root[data-archetype="face-number"] #accent,
      #root[data-archetype="question"] #accent,
      #root[data-archetype="framework"] #accent {
        left: 56px;
        bottom: 44px;
        font-size: 84px;
      }
      #root[data-archetype="face-number"] #title-hook {
        font-size: 280px;
        font-family: "Bangers", "Anton", "Noto Sans TC", sans-serif;
        line-height: 0.85;
        -webkit-text-stroke: 14px var(--stroke);
        text-shadow: 12px 12px 0 var(--stroke);
        max-width: 760px;
      }
      #root[data-archetype="face-number"] #cutout { max-width: 480px; height: 95%; }
      #root[data-archetype="question"] #title-hook { font-size: 160px; max-width: 640px; }
      #root[data-archetype="framework"] #cutout { max-width: 420px; height: 90%; right: 20px; }
      #root[data-archetype="framework"] #title-hook { font-size: 140px; max-width: 820px; }

      /* Auto-shrink default-family for long titles */
      #root[data-archetype="default"] #title-hook[data-len="long"],
      #root[data-archetype="face-number"] #title-hook[data-len="long"],
      #root[data-archetype="question"] #title-hook[data-len="long"],
      #root[data-archetype="framework"] #title-hook[data-len="long"]  { font-size: 140px; }
      #root[data-archetype="default"] #title-hook[data-len="xlong"],
      #root[data-archetype="face-number"] #title-hook[data-len="xlong"],
      #root[data-archetype="question"] #title-hook[data-len="xlong"],
      #root[data-archetype="framework"] #title-hook[data-len="xlong"] { font-size: 110px; }

      /* ════════════════════════════════════════════════════════════════════
         3-LAYER AI-COMPOSITED VARIANTS
         Layer 1: #bg   — GPT Image 1 generated EMPTY environment plate
         Layer 2: #cutout — REAL host cutout PNG positioned per template
         Layer 3: #title-hook + #accent — CSS text overlay per template
      ════════════════════════════════════════════════════════════════════ */

      /* Reset overlay default — each tv* template sets its own */
      #root[data-archetype^="tv"] #overlay { background: none; }
      /* Reset cutout default — each tv* template positions its own */
      #root[data-archetype^="tv"] #cutout {
        right: auto;
        bottom: auto;
        max-width: none;
        height: auto;
        object-position: center;
      }

      /* ── T-V1 Face-Right / Text-Left Dual-Zone ─────────────────────────
         AI generates empty dark studio plate.
         Real cutout sits in right half, anchored bottom-right.
         Title goes in left 40-45% over the darker vignette. */
      #root[data-archetype="tv1-face-right"] #cutout {
        right: 32px;
        bottom: 0;
        height: 94%;
        max-width: 520px;
        z-index: 5;
        filter:
          contrast(1.12)
          saturate(0.92)
          drop-shadow(-20px 16px 0 rgba(0,0,0,0.72))
          drop-shadow(-8px 8px 28px rgba(0,0,0,0.85));
      }
      #root[data-archetype="tv1-face-right"] #overlay {
        background:
          radial-gradient(circle at 78% 36%, rgba(255, 214, 150, 0.18) 0%, rgba(255, 214, 150, 0.08) 18%, rgba(0,0,0,0) 36%),
          linear-gradient(to right, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.68) 40%, rgba(0,0,0,0.18) 68%, rgba(0,0,0,0.08) 100%),
          radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,0.72) 100%);
      }
      #root[data-archetype="tv1-face-right"] #title-hook {
        left: 42px;
        top: 49%;
        transform: translateY(-50%);
        max-width: 670px;
        font-size: 154px;
        color: #FFFFFF;
        -webkit-text-stroke: 12px #000000;
        text-shadow:
          10px 10px 0 #000,
          0 0 34px rgba(0,0,0,0.78);
        line-height: 0.9;
      }
      #root[data-archetype="tv1-face-right"][data-has-accent="1"] #title-hook {
        top: 36%;
        max-width: 640px;
        font-size: 170px;
      }
      #root[data-archetype="tv1-face-right"] #title-hook[data-len="long"]  { font-size: 122px; }
      #root[data-archetype="tv1-face-right"] #title-hook[data-len="xlong"] { font-size: 96px; }
      #root[data-archetype="tv1-face-right"] #accent {
        left: 42px;
        top: 55%;
        width: 700px;
        font-family: "LineSeedTW", "Noto Sans TC", "Anton", sans-serif;
        font-size: 134px;
        line-height: 0.95;
        color: #FFD340;
        letter-spacing: 0;
        -webkit-text-stroke: 10px #000000;
        paint-order: stroke fill;
        text-shadow:
          9px 9px 0 #000,
          0 0 30px rgba(0,0,0,0.75);
      }

      /* ── T-V2 Face-Center Tight Crop ────────────────────────────────────
         AI generates moody atmospheric backdrop.
         Real cutout centered, tall (top of head near top edge for tight crop feel).
         Title overlay in bottom band ~20%. */
      #root[data-archetype="tv2-face-center"] #cutout {
        left: 50%;
        bottom: -28px;
        transform: translateX(-50%);
        height: 102%;
        max-width: 740px;
        z-index: 5;
        object-position: bottom center;
        filter: drop-shadow(0 8px 32px rgba(0,0,0,0.6));
      }
      #root[data-archetype="tv2-face-center"] #overlay {
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.00) 60%,
          rgba(0, 0, 0, 0.55) 80%,
          rgba(0, 0, 0, 0.80) 100%
        );
      }
      #root[data-archetype="tv2-face-center"] #title-hook {
        left: 50%;
        bottom: 36px;
        transform: translateX(-50%);
        text-align: center;
        max-width: 1140px;
        font-size: 96px;
        color: #FFF8E7;
        -webkit-text-stroke: 6px #000000;
        text-shadow: 4px 4px 0 #000, 0 0 20px rgba(0,0,0,0.6);
        line-height: 1.0;
      }
      #root[data-archetype="tv2-face-center"] #title-hook[data-len="long"]  { font-size: 80px; }
      #root[data-archetype="tv2-face-center"] #title-hook[data-len="xlong"] { font-size: 64px; }
      #root[data-archetype="tv2-face-center"] #accent {
        left: 50%;
        top: 32px;
        transform: translateX(-50%);
        font-size: 52px;
        color: var(--accent);
      }

      /* ── T-V3 Split-Screen Comparison ───────────────────────────────────
         AI generates cold-left / warm-right split environment.
         Real cutout anchored right half (the "after" side); title top. */
      #root[data-archetype="tv3-split"] #cutout {
        right: 56px;
        bottom: 0;
        height: 78%;
        max-width: 450px;
        z-index: 5;
        filter: drop-shadow(-8px 8px 20px rgba(0,0,0,0.55));
      }
      #root[data-archetype="tv3-split"] #overlay {
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.65) 0%,
          rgba(0, 0, 0, 0.30) 25%,
          rgba(0, 0, 0, 0.00) 45%
        );
      }
      #root[data-archetype="tv3-split"] #title-hook {
        left: 50%;
        top: 38px;
        transform: translateX(-50%);
        text-align: center;
        max-width: 1140px;
        font-size: 108px;
        color: #FFFFFF;
        -webkit-text-stroke: 7px #000000;
        text-shadow: 5px 5px 0 #000, 0 0 24px rgba(0,0,0,0.55);
      }
      #root[data-archetype="tv3-split"] #title-hook[data-len="long"]  { font-size: 88px; }
      #root[data-archetype="tv3-split"] #title-hook[data-len="xlong"] { font-size: 72px; }
      #root[data-archetype="tv3-split"] #accent {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 120px;
        color: #FFFFFF;
        -webkit-text-stroke: 8px #000000;
        background: var(--accent);
        padding: 8px 28px;
        border-radius: 50%;
        box-shadow: 6px 6px 0 #000;
      }

      /* ── T-V8 Colour Pop with Command Text ──────────────────────────────
         AI gives flat saturated colour field (no subject).
         Real cutout anchored right 40%; giant command title left. */
      #root[data-archetype="tv8-color-pop"] #cutout {
        right: 36px;
        bottom: 0;
        height: 92%;
        max-width: 500px;
        z-index: 5;
        filter: drop-shadow(-14px 14px 0 rgba(0,0,0,0.85));
      }
      #root[data-archetype="tv8-color-pop"] #overlay { background: none; }
      #root[data-archetype="tv8-color-pop"] #title-hook {
        left: 48px;
        top: 50%;
        transform: translateY(-50%);
        max-width: 700px;
        font-size: 220px;
        color: #FFFFFF;
        -webkit-text-stroke: 12px #000000;
        text-shadow: 10px 10px 0 #000, 0 0 32px rgba(0,0,0,0.45);
        line-height: 0.9;
        text-transform: none;
      }
      #root[data-archetype="tv8-color-pop"] #title-hook[data-len="long"]  { font-size: 168px; }
      #root[data-archetype="tv8-color-pop"] #title-hook[data-len="xlong"] { font-size: 132px; }
      #root[data-archetype="tv8-color-pop"] #accent {
        left: 48px;
        bottom: 36px;
        font-size: 72px;
        color: var(--accent);
        -webkit-text-stroke: 8px #000000;
      }

      /* ── T-V10 Numerical Metric Hero ────────────────────────────────────
         AI gives empty cinematic backdrop (deep green/red).
         Real cutout bottom-right (reaction).
         Title small top-left, GIANT number bottom-left. */
      #root[data-archetype="tv10-number-hero"] #cutout {
        right: 24px;
        bottom: 0;
        height: 82%;
        max-width: 460px;
        z-index: 5;
        filter: drop-shadow(-10px 10px 24px rgba(0,0,0,0.6));
      }
      #root[data-archetype="tv10-number-hero"] #overlay {
        background: linear-gradient(
          to right,
          rgba(0, 0, 0, 0.45) 0%,
          rgba(0, 0, 0, 0.25) 40%,
          rgba(0, 0, 0, 0.00) 60%
        );
      }
      #root[data-archetype="tv10-number-hero"] #title-hook {
        left: 56px;
        top: 56px;
        max-width: 580px;
        font-size: 82px;
        color: #FFFFFF;
        -webkit-text-stroke: 6px #000000;
        text-shadow: 4px 4px 0 #000;
        line-height: 1.0;
      }
      #root[data-archetype="tv10-number-hero"] #title-hook[data-len="long"]  { font-size: 68px; }
      #root[data-archetype="tv10-number-hero"] #title-hook[data-len="xlong"] { font-size: 56px; }
      #root[data-archetype="tv10-number-hero"] #accent {
        left: 56px;
        bottom: 56px;
        font-size: 320px;
        font-family: "Bangers", "Anton", "Noto Sans TC", sans-serif;
        color: var(--accent);
        -webkit-text-stroke: 16px #000000;
        text-shadow: 14px 14px 0 #000;
        line-height: 0.85;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="thumbnail-youtube"
      data-start="0"
      data-duration="0.5"
      data-width="1280"
      data-height="720"
      data-archetype="default"
      data-composition-variables='{
        "title_hook":        { "type": "string", "default": "未填字卡" },
        "cutout_data_url":   { "type": "string", "default": "" },
        "bg_data_url":       { "type": "string", "default": "" },
        "accent_decoration": { "type": "string", "default": "" },
        "archetype":         { "type": "string", "default": "default" },
        "palette":           { "type": "object", "default": {} }
      }'
    >
      <img id="bg" alt="" />
      <div id="overlay"></div>
      <img id="cutout" alt="" />
      <h1 id="title-hook"></h1>
      <div id="accent"></div>
    </div>

    <script>
      const vars =
        (window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? window.__hyperframes.getVariables()
          : {}) || {};

      const root = document.getElementById("root");
      const palette = vars.palette || {};
      const setVar = (k, v) => v && root.style.setProperty(k, v);
      setVar("--bg",       palette.bg);
      setVar("--bg-2",     palette.bg_2);
      setVar("--fg",       palette.fg);
      setVar("--accent",   palette.accent);
      setVar("--accent-2", palette.accent_2);
      setVar("--stroke",   palette.stroke);
      if (palette.bg_darken !== undefined) {
        root.style.setProperty("--bg-darken", String(palette.bg_darken));
      }

      if (vars.archetype) {
        root.setAttribute("data-archetype", vars.archetype);
      }

      const bgEl = document.getElementById("bg");
      if (vars.bg_data_url) {
        bgEl.src = vars.bg_data_url;
      } else {
        bgEl.style.display = "none";
      }

      const cutoutEl = document.getElementById("cutout");
      if (vars.cutout_data_url) {
        cutoutEl.src = vars.cutout_data_url;
      } else {
        cutoutEl.style.display = "none";
      }

      const title = (vars.title_hook || "未填字卡").trim();
      const titleEl = document.getElementById("title-hook");
      titleEl.textContent = title;
      const visualLen = [...title].reduce(
        (n, c) => n + (/[一-鿿぀-ヿ]/.test(c) ? 2 : 1),
        0
      );
      if (visualLen > 14) titleEl.setAttribute("data-len", "xlong");
      else if (visualLen > 10) titleEl.setAttribute("data-len", "long");

      const accentText = vars.accent_decoration || "";
      document.getElementById("accent").textContent = accentText;
      if (accentText.trim()) {
        root.setAttribute("data-has-accent", "1");
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["thumbnail-youtube"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
