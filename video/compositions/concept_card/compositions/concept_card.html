<!-- nakama:component concept_card（波旬式概念圖解卡：兩個插畫 + 雙向箭頭 +
     橘塊標題，講抽象關係時用——首發場景「相關 ≠ 因果」。透明 overlay 疊
     Resolve track 4。插畫走 data URI variables） -->
<!doctype html>
<html
  lang="zh-Hant"
  data-composition-variables='[
    {"id":"title","type":"string","label":"標題（橘塊）","default":"相關 ≠ 因果"},
    {"id":"left_label","type":"string","label":"左標籤","default":"手機"},
    {"id":"right_label","type":"string","label":"右標籤","default":"焦慮"},
    {"id":"left_src","type":"string","label":"左插畫（data URI）","default":""},
    {"id":"right_src","type":"string","label":"右插畫（data URI）","default":""},
    {"id":"show_sec","type":"number","label":"顯示秒數","default":3.5},
    {"id":"pos_y","type":"number","label":"卡片垂直中心 0-1","default":0.44}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "LINE Seed TW";
        font-weight: 900;
        font-display: block;
        src: url("../assets/fonts/line-seed-tw/LINESeedTW_OTF_Eb.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #card {
        position: absolute; left: 50%; top: var(--pos-y, 44%);
        transform: translate(-50%, -50%);
        width: 88%;
        background: #fffdf8;
        border-radius: 28px;
        border: 6px solid #e87000;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
        padding: 46px 30px 40px;
        display: flex; flex-direction: column; align-items: center; gap: 30px;
        opacity: 0;
        font-family: "LINE Seed TW", "Noto Sans TC", sans-serif;
      }
      #title {
        background: #e87000; color: #fff;
        font-size: 74px; font-weight: 900; line-height: 1.15;
        padding: 8px 34px 14px; white-space: nowrap;
        transform: rotate(-1.4deg);
        margin-top: -84px;  /* 標題塊咬在卡片上緣（波旬語彙：元素疊出層次） */
      }
      #row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
      .side { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 34%; }
      .side img { width: 100%; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18)); }
      .side .label { font-size: 58px; font-weight: 900; color: #40372e; }
      #arrows { display: flex; flex-direction: column; gap: 26px; width: 24%; align-items: center; }
      .arrow { font-size: 96px; font-weight: 900; color: #e87000; line-height: 1; opacity: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-root="true"
      data-composition-id="concept_card"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="6"
    >
      <div id="card">
        <div id="title"></div>
        <div id="row">
          <div class="side">
            <img id="left_img" alt="" />
            <div class="label" id="left_label"></div>
          </div>
          <div id="arrows">
            <div class="arrow" id="a1">→</div>
            <div class="arrow" id="a2">←</div>
          </div>
          <div class="side">
            <img id="right_img" alt="" />
            <div class="label" id="right_label"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const vars =
        (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const showSec = Number(vars.show_sec ?? 3.5);
      document.getElementById("title").textContent = vars.title ?? "相關 ≠ 因果";
      document.getElementById("left_label").textContent = vars.left_label ?? "";
      document.getElementById("right_label").textContent = vars.right_label ?? "";
      const card = document.getElementById("card");
      card.style.top = `${Number(vars.pos_y ?? 0.44) * 100}%`;
      for (const [id, src] of [["left_img", vars.left_src], ["right_img", vars.right_src]]) {
        const el = document.getElementById(id);
        if (src) el.src = src;
        else el.remove();
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ defaults: { transformOrigin: "50% 50%" } });
      // 卡片彈入
      tl.fromTo(
        "#card",
        { opacity: 0, scale: 0.7, yPercent: -46 },
        { opacity: 1, scale: 1, yPercent: -50, duration: 0.45, ease: "back.out(1.9)" },
        0
      );
      // 箭頭輪流打出（雙向因果的視覺論證：→ 先、← 後）
      tl.fromTo("#a1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(2)" }, 0.5);
      tl.fromTo("#a2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(2)" }, 0.85);
      // 箭頭待機脈動（維持「兩邊都在推」的張力）
      tl.to("#a1", { x: 14, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: -1 }, 1.3);
      tl.to("#a2", { x: -14, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: -1 }, 1.3);
      // 退場（獨立 tween——主 tl 有 infinite repeat）
      gsap.to("#card", {
        opacity: 0,
        scale: 0.82,
        duration: 0.25,
        ease: "power2.in",
        delay: Math.max(0.6, showSec - 0.25),
      });
      window.__timelines.main = tl;
    </script>
  </body>
</html>
